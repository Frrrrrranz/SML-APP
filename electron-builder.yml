appId: com.sml.desktop
productName: SML
# NOTE: 使用 electron/dist 作为入口，而非根目录
directories:
  buildResources: electron
  output: release
files:
  - dist/**/*
  - electron/dist/**/*
  - electron/icon.png
  - electron/package.json
  - node_modules/better-sqlite3/**/*
# NOTE: better-sqlite3 包含原生模块，不能打进 asar 包
asar: true
asarUnpack:
  - node_modules/better-sqlite3/**/*
win:
  artifactName: "${productName}-Setup-${version}.${ext}"
  target:
    - nsis
    - zip
  # NOTE: electron-builder 会自动将 256x256 PNG 转为 ICO
  icon: electron/icon.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  # NOTE: 不单独指定 installerIcon/uninstallerIcon，让 electron-builder 自动使用 win.icon
# NOTE: publish 配置供 electron-updater 运行时读取，实际发布由 CI 统一处理
publish:
  provider: github
  owner: Frrrrrranz
  repo: SML-APP
