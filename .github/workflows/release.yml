name: Build & Release

on:
  push:
    tags:
      - 'v*'

# NOTE: 需要写入权限以创建 GitHub Release
permissions:
  contents: write

jobs:
  # ==================== Windows 桌面端构建 ====================
  build-windows:
    name: Build Windows Desktop
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules for Electron
        run: npx @electron/rebuild -m . -w better-sqlite3

      - name: Build Web
        run: npm run build

      - name: Compile Electron TypeScript
        run: npx tsc -p electron/tsconfig.json

      # NOTE: --publish never 不自动创建 Release，由 release Job 统一发布
      - name: Build Electron installer
        run: npx electron-builder --win --publish never

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows_outputs
          path: |
            release/*.exe
            release/*.zip
            release/*.yml
            release/*.blockmap

  # ==================== Android APK 构建 ====================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    # NOTE: environment 提供额外的保护层，可在 GitHub 仓库设置中配置审批规则
    environment: signing

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install dependencies
        run: npm ci

      - name: Build Web
        run: npm run build

      - name: Sync Capacitor to Android
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build unsigned APK
        working-directory: android
        run: ./gradlew assembleRelease

      # NOTE: 使用 GitHub Secrets 中的 keystore 对 APK 签名
      - name: Sign APK
        id: sign_apk
        uses: filippoLeporati93/android-release-signer@v1
        with:
          releaseDirectory: android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
          alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Extract tag name
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Rename signed APK
        run: cp ${{ steps.sign_apk.outputs.signedReleaseFile }} SML-${{ env.tag }}.apk

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android_outputs
          path: SML-*.apk

  # ==================== 统一发布 ====================
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-android]

    steps:
      - name: Extract tag name
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows_outputs
          path: windows_outputs

      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: android_outputs
          path: android_outputs

      # NOTE: 创建 Draft Release，等待人工确认后再正式发布
      - name: Create Draft Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: SML ${{ env.tag }}
          generate_release_notes: true
          files: |
            windows_outputs/*.exe
            windows_outputs/*.zip
            windows_outputs/*.yml
            windows_outputs/*.blockmap
            android_outputs/*.apk
