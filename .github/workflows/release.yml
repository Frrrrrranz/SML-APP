name: Build & Release

on:
  push:
    tags:
      - 'v*'
# NOTE: 非 OTA 的 v* Tag 发布要求版本号三端一致：
# - package.json version
# - constants/app-version.ts APP_VERSION
# - android/app/build.gradle versionName
# 并且 OTA 位重置为 .0：
# - ANDROID_WEB_VERSION = <tag>.0
# - DESKTOP_WEB_VERSION = <tag>.0

# NOTE: 需要写入权限以创建 GitHub Release
permissions:
  contents: write

jobs:
  # ==================== Windows 桌面端构建 ====================
  build-windows:
    name: Build Windows Desktop
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate version consistency for tag release
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PACKAGE_VERSION=$(node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('package.json','utf8'));process.stdout.write(j.version);")
          APP_VERSION=$(node -e "const fs=require('fs');const c=fs.readFileSync('constants/app-version.ts','utf8');const m=c.match(/APP_VERSION\\s*=\\s*'([^']+)'/);if(!m){process.exit(2)};process.stdout.write(m[1]);")
          ANDROID_WEB_VERSION=$(node -e "const fs=require('fs');const c=fs.readFileSync('constants/app-version.ts','utf8');const m=c.match(/ANDROID_WEB_VERSION\\s*=\\s*'([^']+)'/);if(!m){process.exit(2)};process.stdout.write(m[1]);")
          DESKTOP_WEB_VERSION=$(node -e "const fs=require('fs');const c=fs.readFileSync('constants/app-version.ts','utf8');const m=c.match(/DESKTOP_WEB_VERSION\\s*=\\s*'([^']+)'/);if(!m){process.exit(2)};process.stdout.write(m[1]);")
          ANDROID_VERSION=$(node -e "const fs=require('fs');const c=fs.readFileSync('android/app/build.gradle','utf8');const m=c.match(/versionName\\s+\\\"([^\\\"]+)\\\"/);if(!m){process.exit(2)};process.stdout.write(m[1]);")

          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "package.json version ($PACKAGE_VERSION) != tag version ($TAG_VERSION)"
            exit 1
          fi
          if [ "$APP_VERSION" != "$TAG_VERSION" ]; then
            echo "APP_VERSION ($APP_VERSION) != tag version ($TAG_VERSION)"
            exit 1
          fi
          if [ "$ANDROID_VERSION" != "$TAG_VERSION" ]; then
            echo "android versionName ($ANDROID_VERSION) != tag version ($TAG_VERSION)"
            exit 1
          fi
          if [ "$ANDROID_WEB_VERSION" != "$TAG_VERSION.0" ]; then
            echo "ANDROID_WEB_VERSION ($ANDROID_WEB_VERSION) must equal $TAG_VERSION.0 for non-OTA release"
            exit 1
          fi
          if [ "$DESKTOP_WEB_VERSION" != "$TAG_VERSION.0" ]; then
            echo "DESKTOP_WEB_VERSION ($DESKTOP_WEB_VERSION) must equal $TAG_VERSION.0 for non-OTA release"
            exit 1
          fi

      - name: Rebuild native modules for Electron
        run: npx @electron/rebuild -m . -w better-sqlite3

      # NOTE: 注入 Supabase 环境变量，否则 Vite 打包时 createClient 会收到空字符串并抛出异常，导致白屏
      - name: Build Web
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Compile Electron TypeScript
        run: npx tsc -p electron/tsconfig.json

      # NOTE: --publish never 不自动创建 Release，由 release Job 统一发布
      - name: Build Electron installer
        run: npx electron-builder --win --publish never

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows_outputs
          path: |
            release/*.exe
            release/*.zip
            release/*.yml
            release/*.blockmap

  # ==================== Android APK 构建 ====================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    # NOTE: environment 提供额外的保护层，可在 GitHub 仓库设置中配置审批规则
    environment: signing

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install dependencies
        run: npm ci

      # NOTE: 注入 Supabase 环境变量，否则 Vite 打包时 createClient 会收到空字符串并抛出异常，导致白屏
      - name: Build Web
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Sync Capacitor to Android
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build unsigned APK
        working-directory: android
        run: ./gradlew assembleRelease

      # NOTE: 使用 GitHub Secrets 中的 keystore 对 APK 签名
      - name: Sign APK
        id: sign_apk
        uses: filippoLeporati93/android-release-signer@v1
        with:
          releaseDirectory: android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
          alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Extract tag name
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Rename signed APK
        run: cp ${{ steps.sign_apk.outputs.signedReleaseFile }} SML-${{ env.tag }}.apk

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android_outputs
          path: SML-*.apk

  # ==================== 统一发布 ====================
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-android]

    steps:
      - name: Extract tag name
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows_outputs
          path: windows_outputs

      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: android_outputs
          path: android_outputs

      # NOTE: 创建 Draft Release，等待人工确认后再正式发布
      - name: Create Draft Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: SML ${{ env.tag }}
          generate_release_notes: true
          files: |
            windows_outputs/*.exe
            windows_outputs/*.zip
            windows_outputs/*.yml
            windows_outputs/*.blockmap
            android_outputs/*.apk
